name: Monitor nekretnina

on:
  schedule:
    - cron: "0 8-22/2 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run checker
        run: python check_listings.py

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_listings.json
          git commit -m "Update seen listings" || echo "No changes"
          git push
